<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandate</title>
  <meta name="description" content="Your assistant spends only inside rules you set. Every request is checked, and nothing moves without you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230776ea'/%3E%3Cpath d='M7 16h4.5l3-7 4 14 3-7H25' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
  <!-- crypto-surface:start -->
  <!-- Machine layer: the vendored crypto libraries the tested signer modules
       import. Mapped here so the same modules work in this app untouched. -->
  <script type="importmap" nonce="__CSP_NONCE__">
    {
      "imports": {
        "@scure/starknet": "/vendor/scure/starknet/index.js",
        "@noble/curves/": "/vendor/noble/curves/",
        "@noble/hashes/": "/vendor/noble/hashes/"
      }
    }
  </script>
  <!-- crypto-surface:end -->
</head>
<body>
  <div class="shell">

    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="28" height="28">
            <rect width="28" height="28" rx="7" fill="var(--color-accent)"></rect>
            <path d="M6 14h4l2.5-6L16 20l2.5-6H22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Mandate</span>
          <span class="brand-sub">your assistant, on your rules</span>
        </span>
      </div>

      <nav class="nav" aria-label="Screens">
        <a class="nav-item" href="#/rules" data-route="rules">
          <svg class="nav-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 13h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><circle cx="11.5" cy="5" r="2" fill="currentColor"></circle><circle cx="6" cy="13" r="2" fill="currentColor"></circle></svg>
          <span>Rules</span>
        </a>
        <a class="nav-item" href="#/requests" data-route="requests">
          <svg class="nav-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
          <span>Requests</span>
        </a>
        <a class="nav-item" href="#/waiting" data-route="waiting">
          <svg class="nav-ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M9 5v4.2l2.8 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>Waiting for you</span>
          <span class="nav-badge" id="nav-wait-count" hidden></span>
        </a>
        <a class="nav-item" href="#/activity" data-route="activity">
          <svg class="nav-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M1 9h3.5L7 3l4 12 2.5-6H17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>Activity</span>
        </a>
        <a class="nav-item" href="#/how" data-route="how">
          <svg class="nav-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M13.5 2.5h-8a2 2 0 0 0-2 2v11h12v-13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M3.5 12.5h12" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>
          <span>How it works</span>
        </a>
      </nav>

      <div class="rail-foot">
        <p class="rail-note">Every number on these screens is read from your live account, not stored here.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="screen-title">Rules</h1>
          <p id="screen-sub">What your assistant may spend, read live from your account.</p>
        </div>
        <div class="topbar-status" id="topbar-status"></div>
      </header>
      <div class="screen" id="screen"></div>
    </main>

  </div>

  <div class="flash-wrap" id="flash" aria-live="polite"></div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Details" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Details</h2>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <noscript>
    <div class="noscript">This app reads your rules live, so it needs scripts enabled.</div>
  </noscript>

  <script type="module" src="/app.js" nonce="__CSP_NONCE__"></script>
</body>
</html>
